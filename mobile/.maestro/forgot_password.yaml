appId: host.exp.exponent
---
- launchApp
- openLink: "exp://10.0.2.2:8081"

# Navegar a pantalla de recuperación
- assertVisible: "Bienvenido de vuelta"
- tapOn: "¿Olvidaste tu contraseña?"
- assertVisible: "¿Olvidaste tu contraseña?"
- assertVisible: "Ingresa tu correo institucional y te enviaremos un código para restablecerla."

# Probar validación: dominio inválido
- tapOn: "correo@uta.edu.ec"
- inputText: "usuario@gmail.com"
- tapOn: "Enviar Código"
- assertVisible: "Dominio inválido"
- tapOn: "OK"

# Probar con correo válido (usuario activo)
- clearText
- inputText: "apuruncajas1832@uta.edu.ec"
- tapOn: "Enviar Código"
- assertVisible: "Código Enviado"
- tapOn: "OK"

# Verificar que avanzó al paso 2
- assertVisible: "Restablecer Contraseña"
- assertVisible: "Código de 6 dígitos"

# Regresar al paso 1
- tapOn: "Regresar"
- assertVisible: "¿Olvidaste tu contraseña?"
